<h2>Login</h2>
<div class="container">
    
    <div class="login-container">
        <!-- <h2>Login</h2> -->
        <!-- The 'action' attribute specifies where to send the form-data -->
        <!-- <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"> -->
        <form [formGroup]="form">
            <!-- <div class="input-group">
                <label for="username">Username</label>
                <input type="text" formControlName="username" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">

            <!-- <button (click)="onSubmit()">Log In</button> -->
              <div class="textbox">
                <div>
                    <kendo-label
                        class="k-display-block"
                        [for]="username"
                        text="Name">
                    </kendo-label>
                    <kendo-textbox
                        #username
                        [style.width.px]="180"
                        placeholder="Enter your username"
                        [clearButton]="true"
                        [size]="size"
                        [rounded]="rounded"
                        [fillMode]="tbfillMode"
                        formControlName="username" >
                    </kendo-textbox>
                </div>
                <div>
                    <kendo-label
                        class="k-display-block"
                        [for]="password"
                        text="Password">
                    </kendo-label>
                    <kendo-textbox
                        #password
                        [style.width.px]="180"
                        placeholder="Enter your password"
                        [clearButton]="true"
                        [size]="size"
                        [rounded]="rounded"
                        [fillMode]="tbfillMode"
                        formControlName="password">
                    </kendo-textbox>
                </div>
             </div>
             <button #btnlogin
                    kendoButton
                    [size]="size"
                    [rounded]="rounded"
                    [fillMode]="fillMode"
                    [themeColor]="themeColor"
                    [svgIcon]="svgData"
                    (click)="onSubmit()">
                    Click to Login
            </button>
        </form>
    </div>
</div>
