<h2>Login</h2>
<div class="container">
    
    <div class="login-container">
        <!-- <h2>Login</h2> -->        
        <form [formGroup]="form">
            
              <div class="textbox">
                <div>
                    <kendo-label
                        class="k-display-block"
                        [for]="username"
                        text="Name">
                    </kendo-label>
                    <kendo-textbox
                        #username
                        [style.width.px]="180"
                        placeholder="Enter your username"
                        [clearButton]="true"
                        [size]="size"
                        [rounded]="rounded"
                        [fillMode]="tbfillMode"
                        formControlName="username" >
                    </kendo-textbox>
                </div>
                <div>
                    <kendo-label
                        class="k-display-block"
                        [for]="password"
                        text="Password">
                    </kendo-label>
                    <kendo-textbox
                        #password
                        [style.width.px]="180"
                        placeholder="Enter your password"
                        [clearButton]="true"
                        [size]="size"
                        [type]="showPassword ? 'text' : 'password'"
                        [rounded]="rounded"
                        [fillMode]="tbfillMode"
                        formControlName="password">
                    </kendo-textbox>
                </div>
             </div>
             <button #btnlogin
                    kendoButton
                    [size]="size"
                    [rounded]="rounded"
                    [fillMode]="fillMode"
                    [themeColor]="themeColor"
                    [svgIcon]="svgData"
                    (click)="onSubmit()">
                    Click to Login
            </button>
        </form>
    </div>
</div>
