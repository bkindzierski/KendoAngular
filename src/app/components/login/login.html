<h2>Login</h2>
<div class="container">
    
    <div class="login-container">
        <!-- <h2>Login</h2> -->
        <!-- The 'action' attribute specifies where to send the form-data -->
        <!-- <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"> -->
        <form [formGroup]="form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" formControlName="username" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" formControlName="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button (click)="onSubmit()">Log In</button>
        </form>
    </div>
</div>
